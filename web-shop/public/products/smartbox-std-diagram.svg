<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" fill="#0f172a" rx="12"/>
  
  <text x="300" y="45" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">SƠ ĐỒ KHỐI PHẦN CỨNG ANCHOR BOX</text>
  <text x="300" y="70" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Kiến trúc phần cứng vi điều khiển ESP32</text>

  <!-- Central ESP32 Box -->
  <rect x="210" y="220" width="180" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <text x="300" y="270" text-anchor="middle" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">ESP32 DevKit V1</text>
  <text x="300" y="295" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Dual Core 240MHz</text>
  <text x="300" y="315" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Wi-Fi &amp; MQTT Protocol</text>
  <text x="300" y="340" text-anchor="middle" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">GPIO / I2C / ADC / PWM</text>

  <!-- Block 1: HC-SR04 -->
  <rect x="40" y="110" width="130" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="135" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">HC-SR04</text>
  <text x="105" y="152" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Cảm biến siêu âm</text>
  <path d="M170 140 L240 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Block 2: MC-38 Reed Switch -->
  <rect x="40" y="210" width="130" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="235" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">MC-38</text>
  <text x="105" y="252" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Công tắc từ nắp hộp</text>
  <path d="M170 240 L210 260" stroke="#64748b" stroke-width="2"/>

  <!-- Block 3: Keypad 4x4 -->
  <rect x="40" y="310" width="130" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="335" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Keypad 4x4</text>
  <text x="105" y="352" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Ma trận PIN dự phòng</text>
  <path d="M170 340 L210 330" stroke="#64748b" stroke-width="2"/>

  <!-- Block 4: Load Cell + HX711 -->
  <rect x="40" y="410" width="130" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="435" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Load Cell + HX711</text>
  <text x="105" y="452" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Mạch đo khối lượng</text>
  <path d="M170 440 L240 370" stroke="#64748b" stroke-width="2"/>

  <!-- Block 5: Servo MG90S -->
  <rect x="430" y="140" width="130" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="495" y="165" text-anchor="middle" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Servo MG90S</text>
  <text x="495" y="182" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Đóng/Mở chốt khóa</text>
  <path d="M360 220 L430 170" stroke="#f59e0b" stroke-width="2"/>

  <!-- Block 6: Buzzer + LED -->
  <rect x="430" y="250" width="130" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="495" y="275" text-anchor="middle" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Buzzer &amp; LED</text>
  <text x="495" y="292" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Cảnh báo âm thanh &amp; đèn</text>
  <path d="M390 295 L430 280" stroke="#10b981" stroke-width="2"/>

  <!-- Block 7: Spring Boot Cloud / MQTT Broker -->
  <rect x="430" y="370" width="130" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="495" y="395" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Backend &amp; Broker</text>
  <text x="495" y="412" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Spring Boot / PostgreSQL</text>
  <text x="495" y="426" text-anchor="middle" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">MQTT Mosquitto / Supabase</text>
  <path d="M390 330 L430 390" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Power Supply 5V -->
  <rect x="235" y="470" width="130" height="50" rx="6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="495" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Nguồn Adapter 5V / 2A</text>
  <text x="300" y="510" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Cấp nguồn mạch &amp; Servo</text>
  <path d="M300 470 L300 370" stroke="#e2e8f0" stroke-width="2"/>
</svg>
