<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" fill="#f8fafc" rx="12"/>

  <!-- Cutaway Box Structure -->
  <rect x="130" y="140" width="340" height="380" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="140" y="150" width="320" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Open Lid -->
  <path d="M140 150 L200 80 L520 80 L460 150 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
  <text x="320" y="115" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">NẮP HỘP MỞ ĐỂ BỎ HÀNG</text>

  <!-- Magnetic Reed Switch MC-38 -->
  <rect x="150" y="160" width="30" height="15" rx="3" fill="#ef4444"/>
  <rect x="150" y="142" width="30" height="12" rx="3" fill="#ef4444"/>
  <text x="190" y="172" fill="#ef4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">MC-38 (Cảm biến nắp)</text>

  <!-- Ultrasonic Sensor HC-SR04 -->
  <rect x="360" y="160" width="70" height="24" rx="4" fill="#3b82f6"/>
  <circle cx="378" cy="172" r="8" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="412" cy="172" r="8" fill="#e2e8f0" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="202" fill="#2563eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">HC-SR04 (Phát hiện hàng)</text>

  <!-- Servo Lock Mechanism MG90S -->
  <rect x="150" y="240" width="40" height="30" rx="4" fill="#1e293b"/>
  <path d="M170 255 L195 255" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="260" fill="#d97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Servo MG90S (Chốt khóa)</text>

  <!-- Package Illustration Inside -->
  <rect x="230" y="300" width="160" height="110" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <line x1="230" y1="355" x2="390" y2="355" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="310" y1="300" x2="310" y2="410" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="310" y="360" text-anchor="middle" fill="#9a3412" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">BƯU PHẨM</text>

  <!-- Load Cell + HX711 Weighing Plate -->
  <rect x="170" y="440" width="260" height="16" rx="3" fill="#64748b"/>
  <rect x="260" y="460" width="80" height="20" rx="3" fill="#0f172a"/>
  <text x="300" y="475" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Load Cell + HX711</text>
  <text x="300" y="495" text-anchor="middle" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Mâm cân trọng lượng 5kg</text>

  <!-- ESP32 Controller Box on Side -->
  <rect x="425" y="340" width="70" height="80" rx="4" fill="#047857"/>
  <text x="460" y="375" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">ESP32 DevKit</text>
  <text x="460" y="395" text-anchor="middle" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Wi-Fi / MQTT</text>
</svg>
