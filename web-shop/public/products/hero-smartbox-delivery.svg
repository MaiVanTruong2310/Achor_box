<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" fill="none">
  <!-- Clean Canvas -->
  <rect width="640" height="480" fill="#f8fafc" rx="12"/>

  <!-- Porch / Wall Background lines -->
  <rect x="0" y="380" width="640" height="100" fill="#e2e8f0"/>
  <line x1="0" y1="380" x2="640" y2="380" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Anchor Box Unit -->
  <!-- Shadow -->
  <ellipse cx="280" cy="400" rx="140" ry="18" fill="#94a3b8" opacity="0.4"/>

  <!-- Box Body -->
  <rect x="180" y="160" width="200" height="230" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>

  <!-- Lid -->
  <rect x="170" y="130" width="220" height="34" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
  <rect x="250" y="118" width="60" height="12" rx="3" fill="#334155"/>

  <!-- Display Panel -->
  <rect x="195" y="180" width="170" height="46" rx="4" fill="#0f172a"/>
  <circle cx="215" cy="203" r="4" fill="#10b981"/>
  <text x="228" y="206" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">ONLINE</text>
  <rect x="300" y="193" width="55" height="20" rx="3" fill="#2563eb"/>
  <text x="308" y="206" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">LOCKED</text>

  <!-- Keypad mini on unit -->
  <rect x="245" y="240" width="70" height="85" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="258" cy="255" r="3" fill="#94a3b8"/>
  <circle cx="270" cy="255" r="3" fill="#94a3b8"/>
  <circle cx="282" cy="255" r="3" fill="#94a3b8"/>
  <circle cx="294" cy="255" r="3" fill="#2563eb"/>
  <circle cx="258" cy="270" r="3" fill="#94a3b8"/>
  <circle cx="270" cy="270" r="3" fill="#94a3b8"/>
  <circle cx="282" cy="270" r="3" fill="#94a3b8"/>
  <circle cx="294" cy="270" r="3" fill="#2563eb"/>
  <circle cx="258" cy="285" r="3" fill="#94a3b8"/>
  <circle cx="270" cy="285" r="3" fill="#94a3b8"/>
  <circle cx="282" cy="285" r="3" fill="#94a3b8"/>
  <circle cx="294" cy="285" r="3" fill="#2563eb"/>
  <circle cx="258" cy="300" r="3" fill="#64748b"/>
  <circle cx="270" cy="300" r="3" fill="#94a3b8"/>
  <circle cx="282" cy="300" r="3" fill="#64748b"/>
  <circle cx="294" cy="300" r="3" fill="#2563eb"/>

  <!-- Package Illustration Beside or on porch -->
  <rect x="420" y="310" width="130" height="90" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <line x1="420" y1="355" x2="550" y2="355" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="485" y1="310" x2="485" y2="400" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Shipping Label on Parcel -->
  <rect x="440" y="325" width="40" height="22" rx="2" fill="#ffffff" stroke="#9a3412" stroke-width="1"/>
  <line x1="445" y1="332" x2="470" y2="332" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="445" y1="338" x2="465" y2="338" stroke="#64748b" stroke-width="1"/>

  <!-- Technical Callout Badges -->
  <!-- Callout 1: Auto Lock -->
  <g transform="translate(60, 110)">
    <rect width="130" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="10" fill="#eff6ff"/>
    <path d="M16 21 L19 24 L25 18" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="19" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Tự động khóa</text>
    <text x="38" y="32" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Khi shipper hạ nắp</text>
  </g>

  <!-- Callout 2: Weight Sensor -->
  <g transform="translate(420, 180)">
    <rect width="145" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="10" fill="#ecfdf5"/>
    <text x="14" y="25" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">KG</text>
    <text x="38" y="19" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Đo khối lượng</text>
    <text x="38" y="32" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Load Cell + HX711</text>
  </g>

  <!-- Callout 3: MQTT / Wi-Fi -->
  <g transform="translate(60, 290)">
    <rect width="135" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="10" fill="#f0f9ff"/>
    <circle cx="20" cy="21" r="3" fill="#0284c7"/>
    <text x="38" y="19" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Mở khóa từ xa</text>
    <text x="38" y="32" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Wi-Fi &amp; MQTT tức thì</text>
  </g>
</svg>
