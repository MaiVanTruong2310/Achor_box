  <rect x="272" y="310" width="24" height="22" rx="3" fill="#334155"/>
  <text x="280" y="326" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">5</text>
  <rect x="302" y="310" width="24" height="22" rx="3" fill="#334155"/>
  <text x="310" y="326" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">6</text>
  <rect x="332" y="310" width="24" height="22" rx="3" fill="#2563eb"/>
  <text x="340" y="326" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">B</text>

  <rect x="242" y="340" width="24" height="22" rx="3" fill="#334155"/>
  <text x="250" y="356" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">7</text>
  <rect x="272" y="340" width="24" height="22" rx="3" fill="#334155"/>
  <text x="280" y="356" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">8</text>
  <rect x="302" y="340" width="24" height="22" rx="3" fill="#334155"/>
  <text x="310" y="356" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">9</text>
  <rect x="332" y="340" width="24" height="22" rx="3" fill="#2563eb"/>
  <text x="340" y="356" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">C</text>

  <rect x="242" y="370" width="24" height="22" rx="3" fill="#475569"/>
  <text x="250" y="386" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">*</text>
  <rect x="272" y="370" width="24" height="22" rx="3" fill="#334155"/>
  <text x="280" y="386" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">0</text>
  <rect x="302" y="370" width="24" height="22" rx="3" fill="#475569"/>
  <text x="310" y="386" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">#</text>
  <rect x="332" y="370" width="24" height="22" rx="3" fill="#2563eb"/>
  <text x="340" y="386" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">D</text>

  <text x="248" y="412" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">KEYPAD 4x4 &amp; PIN</text>

  <!-- Plus Edition Badges -->
  <rect x="220" y="440" width="160" height="24" rx="4" fill="#0f172a"/>
  <text x="300" y="456" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">CAMERA 1080P • 10KG • UPS</text>

  <text x="300" y="488" text-anchor="middle" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">ANCHOR BOX PLUS</text>
