  <rect x="242" y="280" width="24" height="22" rx="3" fill="#334155"/>
  <text x="250" y="296" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">1</text>
  <rect x="272" y="280" width="24" height="22" rx="3" fill="#334155"/>
