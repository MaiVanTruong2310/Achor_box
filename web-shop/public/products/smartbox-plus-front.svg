  <rect x="332" y="280" width="24" height="22" rx="3" fill="#2563eb"/>
  <text x="340" y="296" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">A</text>

  <rect x="242" y="310" width="24" height="22" rx="3" fill="#334155"/>
