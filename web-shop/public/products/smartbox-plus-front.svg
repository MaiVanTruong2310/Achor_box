<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" fill="#f8fafc" rx="12"/>
  <ellipse cx="300" cy="530" rx="200" ry="26" fill="#cbd5e1" opacity="0.6"/>

  <!-- Plus Box Body (Taller &amp; Wider) -->
  <rect x="130" y="160" width="340" height="350" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

  <!-- Reinforced Top Lid -->
  <rect x="120" y="115" width="360" height="52" rx="6" fill="#cbd5e1" stroke="#1e293b" stroke-width="4"/>
  <rect x="230" y="100" width="140" height="18" rx="4" fill="#0f172a"/>

  <!-- Top Panel -->
  <rect x="160" y="180" width="280" height="74" rx="6" fill="#0f172a"/>

  <!-- Status Lights: Wi-Fi &amp; Battery UPS -->
  <circle cx="190" cy="205" r="5" fill="#10b981"/>
  <text x="202" y="209" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">WI-FI</text>

  <circle cx="245" cy="205" r="5" fill="#38bdf8"/>
  <text x="257" y="209" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">BATTERY 12H</text>

  <!-- Lock Status Badge -->
  <rect x="345" y="196" width="75" height="20" rx="4" fill="#2563eb"/>
  <text x="355" y="210" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">LOCKED</text>

  <!-- Center AI Camera Lens in Top Panel -->
  <rect x="250" y="222" width="100" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="265" cy="235" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="265" cy="235" r="4" fill="#1e40af"/>
  <circle cx="263" cy="233" r="1.5" fill="#ffffff"/>
  <circle cx="277" cy="235" r="2" fill="#ef4444"/>
  <text x="284" y="239" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800">AI CAM 1080P</text>

  <!-- Keypad 4x4 -->
  <rect x="230" y="270" width="140" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>

