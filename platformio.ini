[platformio]
default_envs = esp32dev
src_dir = firmware/src
include_dir = firmware/include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    madhephaestus/ESP32Servo@^3.0.5
    bogde/HX711@^0.7.5
    Keypad
    bblanchon/ArduinoJson@^6.21.3
