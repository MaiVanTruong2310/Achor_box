plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smartbox'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ---- Core ----
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	implementation 'com.github.librepdf:openpdf:2.0.3'
	implementation 'net.sf.jasperreports:jasperreports:6.21.3'
	implementation 'net.sf.jasperreports:jasperreports-fonts:6.21.3'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.1'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:postgresql:1.20.6'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.6'

	// --- IoT & Hardware Integration ---
	// Thư viện Eclipse Paho MQTT client để nhận dữ liệu từ ESP32
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ---- Database driver & migration ----
	// Driver kết nối PostgreSQL (Supabase)
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.liquibase:liquibase-core'

	// ---- Testing ----
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// --- #20 Swagger / OpenAPI (Gợi ý dùng để test API sau này) ---
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// --- JWT (JSON Web Token) & Refresh Token ---
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

tasks.named('test') {
	useJUnitPlatform()
	// Never import local production credentials/providers into automated tests.
	systemProperty 'smartbox.env-file.enabled', 'false'
	// Docker 29+ requires API >=1.44; use a configurable client API for test containers.
	systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
