name: smart_delivery_box
description: Flutter Mobile App for Smart Delivery Box IoT System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.0.0
  http: ^1.1.0
  mqtt_client: ^10.0.0
  provider: ^6.0.5
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.7
  mobile_scanner: ^7.4.0
  image_cropper: ^12.2.1
  local_auth: ^3.0.2
  flutter_secure_storage: 10.0.0
  crypto: ^3.0.7
  flutter_blue_plus: ^1.34.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Asset management for production app
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/logos/
