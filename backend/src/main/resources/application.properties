# ==============================================================================
# 0. CONFIG IMPORT & APPLICATION SETUP
# ==============================================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=smartbox-backend
server.port=${SERVER_PORT:8080}
logging.pattern.level=%5p [traceId=%X{traceId}]

# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Template Engine
spring.thymeleaf.check-template-location=true


# ==============================================================================
# 1. DATABASE, HIKARICP & JPA (POSTGRESQL)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartbox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:4}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=5000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==============================================================================
# 2. LIQUIBASE DATABASE MIGRATIONS
# ==============================================================================
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=public


# ==============================================================================
# 3. REDIS (AUTHENTICATION, TOKEN SESSIONS & RATE LIMITING)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

smartbox.redis.auth.enabled=${REDIS_AUTH_ENABLED:true}
smartbox.redis.auth.max-login-attempts=${REDIS_AUTH_MAX_ATTEMPTS:5}
smartbox.redis.auth.lockout-minutes=${REDIS_AUTH_LOCKOUT_MINUTES:15}


# ==============================================================================
# 4. SECURITY, JWT, CORS & SUPABASE
# ==============================================================================
smartbox.jwt.secret=${JWT_SECRET:}
smartbox.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

smartbox.supabase.url=${SUPABASE_URL:}
smartbox.supabase.anon-key=${SUPABASE_ANON_KEY:}
smartbox.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}


# ==============================================================================
# 5. API DOCUMENTATION (SWAGGER / SPRINGDOC)
# ==============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.filter=true


# ==============================================================================
# 6. EMAIL & SMTP CONFIGURATION
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SmartBox Mail Worker
smartbox.mail.enabled=${MAIL_ENABLED:false}
smartbox.mail.sender-address=${MAIL_SENDER_ADDRESS:}
smartbox.mail.sender-name=${MAIL_SENDER_NAME:SmartBox}
smartbox.mail.backoff-seconds=60
smartbox.mail.claim-seconds=1800
smartbox.mail.worker-delay-ms=10000


# ==============================================================================
# 7. ORDERS, PAYMENT & VNPAY INTEGRATION
# ==============================================================================
smartbox.orders.draft-minutes=${DRAFT_TIMEOUT_MINUTES:30}

smartbox.payment.provider=${PAYMENT_PROVIDER:vnpay}
smartbox.payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:15}
smartbox.payment.flashsale-timeout-minutes=${FLASHSALE_TIMEOUT_MINUTES:5}
smartbox.payment.hmac-secret=${PAYMENT_HMAC_SECRET:}
smartbox.payment.expiry-delay-ms=60000
smartbox.payment.expiry-poll-ms=${PAYMENT_EXPIRY_POLL_MS:5000}

# VNPay Gateway
smartbox.vnpay.tmn-code=${VNPAY_TMN_CODE:}
smartbox.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
smartbox.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
smartbox.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payments/vnpay/return}
smartbox.vnpay.environment=${VNPAY_ENVIRONMENT:sandbox}


# ==============================================================================
# 8. IOT / MQTT & HARDWARE INSTALLATION
# ==============================================================================
smartbox.mqtt.enabled=${MQTT_ENABLED:false}
smartbox.mqtt.broker-url=${MQTT_BROKER_URL:}
smartbox.mqtt.username=${MQTT_USERNAME:}
smartbox.mqtt.password=${MQTT_PASSWORD:}
smartbox.mqtt.subscriptions=${MQTT_SUBSCRIPTIONS:delivery_box/+/status,delivery_box/+/sensor,delivery_box/+/ack}
smartbox.mqtt.retry-delay-ms=${MQTT_RETRY_DELAY_MS:5000}

smartbox.installation.freshness-seconds=${INSTALLATION_FRESHNESS_SECONDS:90}
smartbox.installation.weight-min-delta-kg=${INSTALLATION_WEIGHT_MIN_DELTA_KG:0.05}
smartbox.installation.tare-tolerance-kg=${INSTALLATION_TARE_TOLERANCE_KG:0.05}
smartbox.warranty.default-months=${WARRANTY_DEFAULT_MONTHS:12}


# ==============================================================================
# 9. THIRD-PARTY SERVICES (CLOUDINARY & FIREBASE FCM)
# ==============================================================================
# Cloudinary Storage
smartbox.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
smartbox.cloudinary.api-key=${CLOUDINARY_API_KEY:}
smartbox.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Firebase Cloud Messaging (Push Notifications)
smartbox.fcm.enabled=${FCM_ENABLED:false}
smartbox.fcm.project-id=${FCM_PROJECT_ID:}
smartbox.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}


# ==============================================================================
# 10. SYSTEM URLS, DASHBOARD, REPORTS & INVOICES
# ==============================================================================
smartbox.public-url=${BACKEND_PUBLIC_URL:http://localhost:8080}
smartbox.shop-url=${SHOP_URL:http://localhost:5174}
smartbox.jobs.enabled=${SMARTBOX_JOBS_ENABLED:true}

# Dashboard Executor & Reports
smartbox.dashboard.timeout-ms=${DASHBOARD_TIMEOUT_MS:1500}
smartbox.dashboard.core-size=${DASHBOARD_CORE_SIZE:8}
smartbox.dashboard.queue-capacity=${DASHBOARD_QUEUE_CAPACITY:100}
smartbox.reports.font-path=${REPORT_FONT_PATH:C:/Windows/Fonts/arial.ttf}

# Sales Invoice Merchant Details (Snapshot at first issue)
smartbox.invoice.shop.name=${INVOICE_SHOP_NAME:SmartBox}
smartbox.invoice.shop.address=${INVOICE_SHOP_ADDRESS:}
smartbox.invoice.shop.phone=${INVOICE_SHOP_PHONE:}
smartbox.invoice.shop.email=${INVOICE_SHOP_EMAIL:}
smartbox.invoice.shop.website=${INVOICE_SHOP_WEBSITE:}
smartbox.invoice.shop.tax-code=${INVOICE_SHOP_TAX_CODE:}