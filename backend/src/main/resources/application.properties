spring.application.name=smartbox-backend
logging.pattern.level=%5p [traceId=%X{traceId}]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartbox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:16}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
smartbox.supabase.url=${SUPABASE_URL:}
smartbox.supabase.anon-key=${SUPABASE_ANON_KEY:}
smartbox.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
smartbox.jwt.secret=${JWT_SECRET:}
smartbox.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
smartbox.jobs.enabled=${SMARTBOX_JOBS_ENABLED:false}
smartbox.public-url=${BACKEND_PUBLIC_URL:http://localhost:8080}
smartbox.shop-url=${SHOP_URL:}
smartbox.orders.draft-minutes=${DRAFT_TIMEOUT_MINUTES:30}
smartbox.payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:15}
smartbox.payment.hmac-secret=${PAYMENT_HMAC_SECRET:}
smartbox.payment.expiry-delay-ms=60000
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smartbox.mail.enabled=${MAIL_ENABLED:false}
smartbox.mail.sender-address=${MAIL_SENDER_ADDRESS:}
smartbox.mail.sender-name=${MAIL_SENDER_NAME:SmartBox}
smartbox.mail.backoff-seconds=60
smartbox.mail.claim-seconds=1800
smartbox.mail.worker-delay-ms=10000
spring.thymeleaf.check-template-location=true
smartbox.dashboard.timeout-ms=1500
smartbox.dashboard.core-size=4
smartbox.dashboard.queue-capacity=50
smartbox.reports.font-path=${REPORT_FONT_PATH:C:/Windows/Fonts/arial.ttf}
smartbox.mqtt.enabled=${MQTT_ENABLED:false}
smartbox.mqtt.broker-url=${MQTT_BROKER_URL:}
smartbox.mqtt.username=${MQTT_USERNAME:}
smartbox.mqtt.password=${MQTT_PASSWORD:}
smartbox.mqtt.subscriptions=${MQTT_SUBSCRIPTIONS:delivery_box/+/status,delivery_box/+/sensor,delivery_box/+/ack}
smartbox.fcm.enabled=${FCM_ENABLED:false}
smartbox.fcm.project-id=${FCM_PROJECT_ID:}
smartbox.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}
